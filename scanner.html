<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quantbot Scanner — Trading Suite</title>
<link rel="stylesheet" href="shared.css">
<style>
:root{
  --bg-surface:var(--bg-card); --text-primary:var(--text);
  --text-secondary:var(--text-dim); --text-muted:var(--text-mute);
  --r:10px; --r-sm:6px;
  --call:#4ade80; --put:#f87171; --warn:#fbbf24;
}
body{padding:0 0 48px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:20;background:rgba(8,12,24,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 0}
.topbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:.3px}
.brand span{color:var(--accent)}
.nav{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.nav a{color:var(--text-secondary);text-decoration:none;font-size:12px;
  padding:4px 9px;border-radius:var(--r-sm);border:1px solid transparent}
.nav a:hover{color:var(--text);border-color:var(--border-hi)}
.nav a.on{color:var(--accent);border-color:var(--border-hi)}
.stamp{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}

/* ── regime strip ── */
.regime{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin:16px 0}
.rcell{background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 14px}
.rlab{font-size:10px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:5px}
.rval{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.rsub{font-size:11px;color:var(--text-secondary);margin-top:3px;line-height:1.35}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;
  font-weight:700;letter-spacing:.6px}
.pill.IDEAL{background:rgba(74,222,128,.15);color:var(--call);
  border:1px solid rgba(74,222,128,.35)}
.pill.CAUTION{background:rgba(251,191,36,.15);color:var(--warn);
  border:1px solid rgba(251,191,36,.35)}
.pill.AVOID{background:rgba(248,113,113,.15);color:var(--put);
  border:1px solid rgba(248,113,113,.4)}
.pill.UNKNOWN{background:rgba(148,163,184,.12);color:var(--text-secondary);
  border:1px solid var(--border-hi)}

h2.sec{font-size:12px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--text-muted);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .count{background:var(--bg-input);border:1px solid var(--border);
  border-radius:99px;padding:1px 8px;font-size:10px;color:var(--text-secondary)}

/* ── signal cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card.call{border-top:3px solid var(--call)}
.card.put{border-top:3px solid var(--put)}
.chead{display:flex;align-items:baseline;gap:8px;padding:12px 14px 8px}
.cside{font-size:15px;font-weight:800;letter-spacing:.5px}
.card.call .cside{color:var(--call)} .card.put .cside{color:var(--put)}
.ctick{font-size:19px;font-weight:800}
.cstrike{font-size:13px;color:var(--text-secondary);margin-left:auto;
  font-variant-numeric:tabular-nums}
.rows{padding:0 14px 10px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;
  border-bottom:1px dashed rgba(42,58,85,.45)}
.row:last-child{border-bottom:0}
.row .k{color:var(--text-secondary)}
.row .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.v.good{color:var(--call)} .v.bad{color:var(--put)} .v.warn{color:var(--warn)}
.exitif{margin:0 14px 10px;padding:8px 10px;border-radius:var(--r-sm);
  background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);
  font-size:12px;color:#fca5a5}
.exitif b{color:var(--put)}
.spark{padding:0 6px 6px}
.cfoot{margin-top:auto;display:flex;gap:8px;padding:10px 14px;
  border-top:1px solid var(--border);background:rgba(10,15,30,.4)}
.btn{flex:1;background:var(--bg-input);color:var(--text);border:1px solid var(--border-hi);
  border-radius:var(--r-sm);padding:7px 10px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--grad);border-color:transparent;color:#04121f}
.countdown{font-variant-numeric:tabular-nums}
.countdown.urgent{color:var(--warn);font-weight:700}
.countdown.dead{color:var(--put)}

/* ── chart ── */
.chartbox{background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 14px}
.chead2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.chead2 .t{font-size:16px;font-weight:800}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;font-size:11px;
  color:var(--text-secondary)}
.legend i{display:inline-block;width:14px;height:0;border-top-width:2px;
  border-top-style:solid;vertical-align:middle;margin-right:5px}
.chart-scroll{overflow-x:auto}

/* ── feed ── */
.feed{background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden}
.fitem{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--border);font-size:13px}
.fitem:last-child{border-bottom:0}
.fitem .tk{font-weight:700;min-width:48px}
.fitem .st{color:var(--text-secondary);font-size:12px;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .pnl{font-variant-numeric:tabular-nums;font-weight:700}
.fitem .when{color:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}

/* ── modal ── */
.veil{position:fixed;inset:0;background:rgba(4,8,18,.78);display:none;
  align-items:center;justify-content:center;z-index:60;padding:16px}
.veil[data-open]{display:flex}
.modal{background:var(--bg-surface);border:1px solid var(--border-hi);
  border-radius:var(--r);padding:18px;max-width:380px;width:100%}
.modal h3{font-size:15px;margin-bottom:4px}
.modal p{font-size:12px;color:var(--text-secondary);margin-bottom:14px;line-height:1.45}
.mrow{display:flex;gap:8px;margin-bottom:8px}
.modal input{width:100%;background:var(--bg-input);border:1px solid var(--border);
  color:var(--text);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;
  font-family:inherit;margin-bottom:8px}
.empty{background:var(--bg-surface);border:1px dashed var(--border-hi);
  border-radius:var(--r);padding:26px 16px;text-align:center;
  color:var(--text-secondary);font-size:13px;line-height:1.5}
.note{font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5}
.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);
  color:#fca5a5;padding:10px 12px;border-radius:var(--r-sm);font-size:12px;margin:12px 0}
@media (max-width:520px){.cards{grid-template-columns:1fr}.rval{font-size:17px}}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <div class="brand">QUANT<span>BOT</span> SCANNER</div>
  <nav class="nav">
    <a href="index.html">Home</a><a class="on" href="scanner.html">Scanner</a>
    <a href="backtest.html">Backtest</a><a href="journal.html">Journal</a>
    <a href="planner.html">Planner</a>
  </nav>
  <div class="stamp" id="stamp">loading…</div>
</div></div>

<div class="wrap">
  <div id="err"></div>

  <!-- 3. REGIME -->
  <div class="regime" id="regime"></div>

  <!-- 3b. GEX + SKEW -->
  <h2 class="sec">Dealer gamma &amp; skew</h2>
  <div id="gex"></div>

  <!-- 3c. CALENDAR -->
  <h2 class="sec">Today's events <span class="count" id="nevents">0</span></h2>
  <div id="events"></div>

  <!-- 1. ACTIVE SIGNALS -->
  <h2 class="sec">Active signals <span class="count" id="nsig">0</span></h2>
  <div id="signals"></div>

  <!-- 2. LIVE CHART -->
  <h2 class="sec">Live chart</h2>
  <div id="chartwrap"></div>

  <!-- 4. RECENT -->
  <h2 class="sec">Recent signals <span class="count" id="nfeed">0</span></h2>
  <div id="feed"></div>

  <!-- 5. BRAIN -->
  <h2 class="sec">Brain status</h2>
  <div class="regime" id="brain"></div>

  <p class="note" id="foot"></p>
</div>

<div class="veil" id="veil"><div class="modal">
  <h3 id="mtitle">Log trade</h3>
  <p>This opens Telegram with the result pre-filled — the bot records it and
     updates the pattern's live win rate.</p>
  <div class="mrow">
    <button class="btn" id="mwin">💚 Win</button>
    <button class="btn" id="mloss">❤️ Loss</button>
  </div>
  <input id="mcustom" placeholder="Custom — e.g. +$180, -144, scratched">
  <div class="mrow">
    <button class="btn primary" id="msend">Send to Telegram</button>
    <button class="btn" id="mclose">Cancel</button>
  </div>
</div></div>

<script>
'use strict';
/* ────────────────────────────────────────────────────────────────────────
   Quantbot dashboard. Renders entirely from signals.json, which the scanner
   publishes every ~60s and which now carries the regime, the brain status,
   the dollar-denominated signal cards and a 30-bar price tail per symbol.

   No API key lives in this file. The previous version hardcoded a Polygon
   key in a PUBLIC repo, which handed a paid subscription to anyone who
   viewed source. Live mode is opt-in and reads a key the viewer pastes,
   which is kept in localStorage on their own machine and never committed.
   ──────────────────────────────────────────────────────────────────────── */

const SRC = 'signals.json';
const POLL_MS = 20000;
const TG_BOT = 'quantclawwwbot';
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t);
  if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* dollars with the sign outside the symbol: -$144, not $-144 */
function money(v, dp) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  const n = Number(v), a = Math.abs(n);
  const d = dp !== undefined ? dp : (a >= 100 ? 0 : 2);
  return (n < 0 ? '-$' : '$') + a.toLocaleString('en-US',
    { minimumFractionDigits: d, maximumFractionDigits: d });
}
const num = (v, d = 2) => (v === null || v === undefined || isNaN(v))
  ? '—' : Number(v).toFixed(d);
const pct = v => (v === null || v === undefined || isNaN(v))
  ? '—' : (Number(v) * 100).toFixed(0) + '%';

let DATA = null, CHART_SYM = null;

/* ───────────────────────────── fetch loop ───────────────────────────── */
async function load() {
  try {
    const r = await fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    $('#err').innerHTML = '';
    render();
  } catch (e) {
    $('#err').innerHTML = '<div class="err">Could not load signals.json (' +
      esc(e.message) + '). The scanner publishes it while the market is open; ' +
      'this page shows the last snapshot it pushed.</div>';
  }
}

/* ───────────────────────────── regime panel ─────────────────────────── */
function renderRegime() {
  const d = DATA, g = d.regime || {}, tod = d.time_of_day || {};
  const trend = { vix_rising: '▲ rising', vix_falling: '▼ falling',
                  vix_flat: '▬ flat' }[g.vix_trend] || '—';
  const trendCls = g.vix_trend === 'vix_rising' ? 'bad'
    : g.vix_trend === 'vix_falling' ? 'good' : '';
  const cells = [
    ['VIX', num(g.vix ?? (d.vix || {}).value, 2),
      esc((g.vix_source || (d.vix || {}).source || ''))],
    ['VIX trend', '<span class="' + trendCls + '">' + trend + '</span>',
      'intraday, from the VIX proxy'],
    ['Regime', '<span class="pill ' + esc(g.label || 'UNKNOWN') + '">' +
      esc(g.label || 'UNKNOWN') + '</span>', esc(g.detail || '')],
    ['Time of day', esc(tod.label || '—'),
      tod.minutes_left ? tod.minutes_left + ' min left in window' :
      (d.market || {}).status || ''],
  ];
  const spySkew = (d.skew || {}).SPY;
  if (spySkew && spySkew.skew_points != null)
    cells.push(['IV skew (SPY)',
      (spySkew.skew_points > 0 ? '+' : '') + spySkew.skew_points.toFixed(1),
      esc(spySkew.label || '')]);
  const spyGex = (d.gex || {}).SPY;
  if (spyGex) cells.push(['Dealer gamma', '<span class="pill ' +
    (spyGex.regime === 'long_gamma' ? 'IDEAL'
      : spyGex.regime === 'short_gamma' ? 'AVOID' : 'UNKNOWN') + '">' +
    esc(spyGex.label) + '</span>', esc(spyGex.favours || '')]);
  const cal = d.calendar || {};
  if (cal.news_window) cells.push(['News window',
    '<span class="pill AVOID">' + (cal.suppressed ? 'SUPPRESSED' : 'CAUTION') +
    '</span>', esc(cal.reason || '')]);
  $('#regime').innerHTML = cells.map(([k, v, s]) =>
    '<div class="rcell"><div class="rlab">' + k + '</div>' +
    '<div class="rval">' + v + '</div><div class="rsub">' + s + '</div></div>'
  ).join('');
}

/* ──────────────────────────── gex + skew ───────────────────────────── */
function bn(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  const a = Math.abs(v), sign = v < 0 ? '-' : '';
  if (a >= 1e9) return sign + '$' + (a / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return sign + '$' + (a / 1e6).toFixed(0) + 'M';
  return sign + '$' + a.toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function renderGex() {
  const g = DATA.gex || {}, sk = DATA.skew || {};
  const names = Object.keys(g).length ? Object.keys(g) : Object.keys(sk);
  const box = $('#gex');
  if (!names.length) {
    box.innerHTML = '<div class="empty">No dealer-gamma reading in the last ' +
      'snapshot. It is computed from the full same-day chain and refreshes ' +
      'every 15 minutes while the scanner runs.</div>';
    return;
  }
  box.innerHTML = '<div class="cards">' + names.map(t => {
    const r = g[t] || {}, s2 = sk[t] || {};
    const cls = r.regime === 'long_gamma' ? 'call'
      : r.regime === 'short_gamma' ? 'put' : '';
    const pillCls = r.regime === 'long_gamma' ? 'IDEAL'
      : r.regime === 'short_gamma' ? 'AVOID' : 'UNKNOWN';
    const skewCls = s2.regime === 'downside' ? 'bad'
      : s2.regime === 'upside' ? 'good' : '';
    return '<div class="card ' + cls + '">' +
      '<div class="chead"><span class="ctick">' + esc(t) + '</span>' +
      '<span class="cstrike"><span class="pill ' + pillCls + '">' +
        esc(r.label || 'n/a') + ' ' + esc(r.arrow || '') + '</span></span></div>' +
      '<div class="rows">' +
        row('Net GEX', bn(r.net_gex), r.net_gex > 0 ? 'good' : 'bad') +
        row('Magnet strike', r.magnet_strike != null
          ? money(r.magnet_strike, 0) + ' (' + (r.magnet_oi || 0)
            .toLocaleString('en-US') + ' OI)' : '—') +
        row('Gamma flip', r.flip_point != null ? money(r.flip_point, 2) : '—') +
        row('Spot', r.spot != null ? money(r.spot, 2) : '—') +
        row('IV skew (25Δ)', s2.skew_points != null
          ? (s2.skew_points > 0 ? '+' : '') + s2.skew_points.toFixed(1) +
            ' · ' + esc(s2.regime || '') : '—', skewCls) +
      '</div>' +
      (r.implication ? '<div class="exitif" style="background:rgba(56,189,248,.07);' +
        'border-color:rgba(56,189,248,.25);color:#7dd3fc"><b>Implication:</b> ' +
        esc(r.implication) + '</div>' : '') +
      '</div>';
  }).join('') + '</div>' +
  '<p class="note">GEX = open interest × gamma × 100 × spot, summed with calls ' +
  'positive and puts negative. Dealer inventory is not public, so this is the ' +
  'standard proxy, not a position report.</p>';
}

function renderEvents() {
  const c = DATA.calendar || {};
  const evs = (c.events_today || []).filter(e => e.impact !== 'low');
  $('#nevents').textContent = evs.length;
  const box = $('#events');
  if (!evs.length) {
    box.outerHTML = '<div class="empty" id="events">No high or medium impact ' +
      'events scheduled today.</div>';
    return;
  }
  box.className = 'feed';
  box.innerHTML = evs.map(e => {
    const hi = e.impact === 'high';
    return '<div class="fitem"><span>' + (hi ? '⛔' : '⚠️') + '</span>' +
      '<span class="tk">' + esc(e.time_et || '') + '</span>' +
      '<span class="st">' + esc(e.title) + '</span>' +
      '<span class="pnl ' + (hi ? 'bad' : '') + '">' +
      (hi ? 'suppress ±30m' : 'caution') + '</span></div>';
  }).join('') +
  (c.news_window ? '<div class="fitem"><span>🔴</span><span class="st">' +
    esc(c.reason || 'inside a news window') + ' — signals ' +
    (c.suppressed ? 'suppressed' : 'downgraded') + ' right now</span></div>' : '');
}

/* ───────────────────────────── sparkline ───────────────────────────── */
function sparkline(bars, w, h) {
  if (!bars || bars.length < 2) return '';
  const cs = bars.map(b => b.c).filter(v => v != null);
  if (cs.length < 2) return '';
  const lo = Math.min(...cs), hi = Math.max(...cs), span = (hi - lo) || 1;
  const step = w / (cs.length - 1);
  const pts = cs.map((c, i) =>
    [i * step, h - ((c - lo) / span) * (h - 6) - 3]);
  const up = cs[cs.length - 1] >= cs[0];
  const col = up ? 'var(--call)' : 'var(--put)';
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' +
    p[1].toFixed(1)).join(' ');
  const area = line + ` L${w} ${h} L0 ${h} Z`;
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h +
    '" preserveAspectRatio="none" role="img" aria-label="price, last ' +
    cs.length + ' minutes">' +
    '<path d="' + area + '" fill="' + col + '" opacity=".10"/>' +
    '<path d="' + line + '" fill="none" stroke="' + col +
    '" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}

/* ───────────────────────── active signal cards ──────────────────────── */
function countdownHTML(iso) {
  if (!iso) return '<span class="countdown">—</span>';
  const mins = Math.max(0, Math.floor((new Date(iso) - Date.now()) / 60000));
  const cls = mins === 0 ? 'dead' : mins < 5 ? 'urgent' : '';
  const t = new Date(iso).toLocaleTimeString('en-US',
    { hour: 'numeric', minute: '2-digit' });
  const txt = mins === 0 ? 'CLOSED' : mins + ' min left';
  return '<span class="countdown ' + cls + '" data-close="' + esc(iso) + '">' +
    txt + '</span> <span style="color:var(--text-muted);font-size:11px">(' +
    esc(t) + ')</span>';
}

function signalCard(s) {
  const side = String(s.side || 'CALL').toUpperCase();
  const isCall = side === 'CALL';
  const z = s.sizing || {};
  const c = s.context || {};
  const bars = (DATA.bars || {})[s.ticker] || [];
  const card = el('div', 'card ' + (isCall ? 'call' : 'put'));
  card.innerHTML =
    '<div class="chead"><span class="cside">' + (isCall ? '🟢 CALL' : '🔴 PUT') +
      '</span><span class="ctick">' + esc(s.ticker) + '</span>' +
      '<span class="cstrike">' + (s.strike != null ? money(s.strike, 0) : '') +
      (s.delta != null ? ' · Δ' + num(Math.abs(s.delta)) : '') + '</span></div>' +
    '<div class="rows">' +
      row('Entry', money(z.entry_low) + '–' + money(z.entry_high)) +
      row('Stale above', money(z.stale_above), 'warn') +
      row('Stop', money(z.stop) + ' → risk ' + money(z.risk_dollars), 'bad') +
      row('Target', money(z.target) + ' → gain ' + money(z.gain_dollars), 'good') +
      row('Contracts', (z.contracts ?? '—') + ' @ ' + money(z.entry_mid)) +
      row('Window', countdownHTML(s.window_close)) +
    '</div>' +
    (s.exit_if ? '<div class="exitif"><b>Exit if:</b> ' + esc(s.exit_if) +
      '</div>' : '') +
    (bars.length > 1 ? '<div class="spark">' + sparkline(bars, 300, 44) +
      '</div>' : '') +
    '<div class="cfoot"><button class="btn primary" data-log="' +
      esc(s.signal_id) + '">Log trade</button>' +
      '<button class="btn" data-chart="' + esc(s.ticker) + '">Chart</button></div>';
  return card;
}
function row(k, v, cls) {
  return '<div class="row"><span class="k">' + k + '</span><span class="v ' +
    (cls || '') + '">' + v + '</span></div>';
}

function renderSignals() {
  const box = $('#signals');
  const sigs = DATA.active_signals || [];
  $('#nsig').textContent = sigs.length;
  box.innerHTML = '';
  if (!sigs.length) {
    box.appendChild(el('div', 'empty',
      'No signal cards fired today.<br>The Telegram bot writes them here when ' +
      'it sends one — ask it for a setup, or wait for the scanner to trigger.'));
    return;
  }
  const grid = el('div', 'cards');
  sigs.forEach(s => grid.appendChild(signalCard(s)));
  box.appendChild(grid);
  if (!CHART_SYM) CHART_SYM = sigs[0].ticker;
}

/* ─────────────────────── candlestick chart (inline SVG) ─────────────── */
function ema(vals, n) {
  const k = 2 / (n + 1); let e = null;
  return vals.map(v => { e = (e === null) ? v : v * k + e * (1 - k); return e; });
}
function vwapSeries(bars) {
  let pv = 0, vv = 0;
  return bars.map(b => {
    const tp = (b.h != null && b.l != null) ? (b.h + b.l + b.c) / 3 : b.c;
    pv += tp * (b.v || 0); vv += (b.v || 0);
    return vv ? pv / vv : b.c;
  });
}

function renderChart() {
  const wrap = $('#chartwrap');
  const sym = CHART_SYM;
  const bars = sym ? ((DATA.bars || {})[sym] || []) : [];
  if (!sym || bars.length < 3) {
    wrap.innerHTML = '<div class="empty">No intraday bars in the last snapshot.' +
      '<br>The scanner publishes a 30-bar tail per symbol while it is running.</div>';
    return;
  }
  const sig = (DATA.active_signals || []).find(s => s.ticker === sym) || null;
  const tk = (DATA.tickers || {})[sym] || {};

  const W = Math.max(620, bars.length * 16), H = 300;
  const PL = 54, PR = 16, PT = 12, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;

  const closes = bars.map(b => b.c);
  const e5 = ema(closes, 5), e20 = ema(closes, 20), vw = vwapSeries(bars);
  let lo = Math.min(...bars.map(b => b.l ?? b.c)),
      hi = Math.max(...bars.map(b => b.h ?? b.c));
  const levels = [];
  if (sig) {
    const spot = (sig.context || {}).spot, vwapLvl = (sig.context || {}).vwap;
    if (sig.strike != null) levels.push(['strike', sig.strike, 'var(--accent)', '4 3']);
    if (vwapLvl != null) levels.push(['exit / VWAP', vwapLvl, 'var(--put)', '6 4']);
    if (spot != null) levels.push(['entry zone', spot, 'var(--call)', null]);
  }
  levels.forEach(l => { lo = Math.min(lo, l[1]); hi = Math.max(hi, l[1]); });
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const Y = v => PT + ih - ((v - lo) / (hi - lo)) * ih;
  const X = i => PL + (i + 0.5) * (iw / bars.length);
  const cw = Math.max(2.5, (iw / bars.length) * 0.58);

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W +
    '" height="' + H + '" role="img" aria-label="' + esc(sym) +
    ' one-minute candles">';
  // gridlines
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    svg += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) +
      '" y2="' + y.toFixed(1) + '" stroke="#1a2540" stroke-width="1"/>' +
      '<text x="' + (PL - 6) + '" y="' + (y + 3.5).toFixed(1) +
      '" fill="#475569" font-size="10" text-anchor="end">' + v.toFixed(2) +
      '</text>';
  }
  // entry zone band (underlying price when the signal fired, ±0.05%)
  const ez = levels.find(l => l[0] === 'entry zone');
  if (ez) {
    const y1 = Y(ez[1] * 1.0005), y2 = Y(ez[1] * 0.9995);
    svg += '<rect x="' + PL + '" y="' + y1.toFixed(1) + '" width="' + iw +
      '" height="' + Math.max(3, (y2 - y1)).toFixed(1) +
      '" fill="var(--call)" opacity=".14"/>';
  }
  // candles
  bars.forEach((b, i) => {
    const x = X(i), up = (b.c >= (b.o ?? b.c));
    const col = up ? 'var(--call)' : 'var(--put)';
    svg += '<line x1="' + x.toFixed(1) + '" y1="' + Y(b.h ?? b.c).toFixed(1) +
      '" x2="' + x.toFixed(1) + '" y2="' + Y(b.l ?? b.c).toFixed(1) +
      '" stroke="' + col + '" stroke-width="1"/>';
    const yo = Y(b.o ?? b.c), yc = Y(b.c);
    svg += '<rect x="' + (x - cw / 2).toFixed(1) + '" y="' +
      Math.min(yo, yc).toFixed(1) + '" width="' + cw.toFixed(1) +
      '" height="' + Math.max(1.2, Math.abs(yc - yo)).toFixed(1) +
      '" fill="' + col + '" opacity="' + (up ? '.85' : '.85') + '"/>';
  });
  // overlays
  const path = arr => arr.map((v, i) =>
    (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  svg += '<path d="' + path(vw) + '" fill="none" stroke="#818cf8" stroke-width="1.6"/>';
  svg += '<path d="' + path(e5) + '" fill="none" stroke="#38bdf8" stroke-width="1.3"/>';
  svg += '<path d="' + path(e20) + '" fill="none" stroke="#fbbf24" stroke-width="1.3"/>';
  levels.filter(l => l[3]).forEach(l => {
    const y = Y(l[1]).toFixed(1);
    svg += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y +
      '" stroke="' + l[2] + '" stroke-width="1.3" stroke-dasharray="' + l[3] + '"/>' +
      '<text x="' + (W - PR - 4) + '" y="' + (Number(y) - 4) + '" fill="' + l[2] +
      '" font-size="10" text-anchor="end">' + esc(l[0]) + ' ' +
      l[1].toFixed(2) + '</text>';
  });
  // x labels
  bars.forEach((b, i) => {
    if (i % Math.ceil(bars.length / 7) === 0)
      svg += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) +
        '" fill="#475569" font-size="10" text-anchor="middle">' + esc(b.t) +
        '</text>';
  });
  svg += '</svg>';

  const opts = Object.keys(DATA.bars || {}).map(s =>
    '<button class="btn" data-chart="' + esc(s) + '" style="flex:0 0 auto;padding:4px 9px' +
    (s === sym ? ';border-color:var(--accent);color:var(--accent)' : '') + '">' +
    esc(s) + '</button>').join('');

  wrap.innerHTML = '<div class="chartbox">' +
    '<div class="chead2"><span class="t">' + esc(sym) + ' · 1 min</span>' +
    '<span class="legend">' +
      '<span><i style="border-color:#818cf8"></i>VWAP</span>' +
      '<span><i style="border-color:#38bdf8"></i>EMA 5</span>' +
      '<span><i style="border-color:#fbbf24"></i>EMA 20</span>' +
      '<span><i style="border-color:var(--put);border-top-style:dashed"></i>exit level</span>' +
      '<span><i style="border-color:var(--call)"></i>entry zone</span>' +
    '</span></div>' +
    '<div class="chart-scroll">' + svg + '</div>' +
    '<div class="cfoot" style="background:none;border:0;padding:8px 0 0;flex-wrap:wrap">' +
      opts + '</div>' +
    '<p class="note">VWAP and EMAs are computed over the published bar tail (' +
      bars.length + ' bars). The engine’s own session values right now: VWAP ' +
      num(tk.vwap) + ' · EMA5 ' + num(tk.ema5) + ' · EMA20 ' + num(tk.ema20) +
      '. Stop and target in dollars are option premiums and live on the signal ' +
      'card; the dashed level here is the underlying price that invalidates the ' +
      'trade.</p></div>';
}

/* ──────────────────────────── recent feed ──────────────────────────── */
function renderFeed() {
  const rows = DATA.results || [];
  $('#nfeed').textContent = rows.length;
  const box = $('#feed');
  if (!rows.length) {
    box.outerHTML = '<div class="empty" id="feed">No logged results yet.<br>' +
      'Tap ✅ Took it on a Telegram signal and the outcome lands here.</div>';
    return;
  }
  box.className = 'feed';
  box.innerHTML = rows.map(r => {
    const p = r.pnl_dollars;
    const win = r.result === 'win' || (p != null && p > 0);
    const icon = r.result === 'skipped' ? '⊘' : win ? '✅' : (p != null || r.result === 'loss') ? '❌' : '➡️';
    const cls = r.result === 'skipped' ? '' : win ? 'good' : 'bad';
    const when = r.logged_at ? new Date(r.logged_at)
      .toLocaleString('en-US', { month: 'short', day: 'numeric',
                                 hour: 'numeric', minute: '2-digit' }) : '';
    return '<div class="fitem"><span>' + icon + '</span>' +
      '<span class="tk">' + esc(r.ticker || '—') + '</span>' +
      '<span class="st">' + esc((r.strategy || '').replace(/_0dte$/, '')
        .replace(/_/g, ' ')) + (r.outcome ? ' · ' + esc(r.outcome) : '') + '</span>' +
      '<span class="pnl ' + cls + '">' + (p != null ? money(p) : esc(r.result || '')) +
      '</span><span class="when">' + esc(when) + '</span></div>';
  }).join('');
}

/* ──────────────────────────── brain status ─────────────────────────── */
function renderBrain() {
  const b = DATA.brain || {};
  const ts = b.top_strategy || {};
  let next = '—';
  if (b.next_run) {
    const ms = new Date(b.next_run) - Date.now();
    const d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000);
    next = ms <= 0 ? 'due' : (d ? d + 'd ' : '') + h + 'h';
  }
  const cells = [
    ['Last lesson', esc(b.last_lesson_date || '—'),
      esc(b.last_lesson || 'no lesson yet')],
    ['Cycle', b.cycle ?? '—', 'completed research cycles'],
    ['Top strategy', esc((ts.name || '—').replace(/_0dte$/, '').replace(/_/g, ' ')),
      ts.profit_factor ? 'PF ' + num(ts.profit_factor) + ' · win ' +
        pct(ts.win_rate) : 'no ranking yet'],
    ['Validated patterns', b.patterns ?? 0, 'in the vault pattern library'],
    ['Next brain run', next, b.next_run ? new Date(b.next_run)
      .toLocaleString('en-US', { weekday: 'short', hour: 'numeric' }) : ''],
  ];
  $('#brain').innerHTML = cells.map(([k, v, s]) =>
    '<div class="rcell"><div class="rlab">' + k + '</div><div class="rval">' +
    v + '</div><div class="rsub">' + s + '</div></div>').join('');
}

/* ───────────────────────────── log modal ───────────────────────────── */
let LOG_ID = null;
function openLog(id) {
  LOG_ID = id;
  const s = (DATA.active_signals || []).find(x => x.signal_id === id);
  $('#mtitle').textContent = s ? 'Log ' + s.ticker + ' ' + s.side : 'Log trade';
  $('#mcustom').value = '';
  $('#veil').setAttribute('data-open', '1');
}
function tg(text) {
  window.open('https://t.me/' + TG_BOT + '?text=' + encodeURIComponent(text),
    '_blank', 'noopener');
  $('#veil').removeAttribute('data-open');
}
function logResult(kind) {
  const s = (DATA.active_signals || []).find(x => x.signal_id === LOG_ID);
  if (!s) return;
  const z = s.sizing || {};
  const d = kind === 'win' ? z.gain_dollars : kind === 'loss' ? -z.risk_dollars : null;
  const word = kind === 'win' ? 'WIN' : 'LOSS';
  tg(word + ': ' + s.ticker + ' ' + (s.strategy || '') + ' ' + s.side +
     (s.strike ? ' $' + s.strike : '') +
     (d != null ? ' ' + (d < 0 ? '-$' : '+$') + Math.abs(d) : ''));
}

/* ───────────────────────────── plumbing ───────────────────────────── */
function render() {
  renderRegime(); renderGex(); renderEvents(); renderSignals();
  renderChart(); renderFeed(); renderBrain();
  const g = DATA.generated_at ? new Date(DATA.generated_at) : null;
  $('#stamp').textContent = g
    ? 'updated ' + g.toLocaleTimeString('en-US',
        { hour: 'numeric', minute: '2-digit', second: '2-digit' }) +
      ' · ' + ((DATA.market || {}).status || '')
    : '—';
  $('#foot').textContent =
    'Rendered from signals.json (schema ' + (DATA.schema ?? '?') + '), published ' +
    'by the scanner. Dollar figures assume the $4,000 per-trade allocation and a ' +
    '30% stop. Backtest statistics carry no commissions or slippage. ' +
    'Alerts and analysis only — nothing here places an order.';
}

document.addEventListener('click', e => {
  const l = e.target.closest('[data-log]');
  if (l) return openLog(l.getAttribute('data-log'));
  const c = e.target.closest('[data-chart]');
  if (c) { CHART_SYM = c.getAttribute('data-chart'); renderChart();
    $('#chartwrap').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
});
$('#mclose').onclick = () => $('#veil').removeAttribute('data-open');
$('#veil').onclick = e => { if (e.target === $('#veil'))
  $('#veil').removeAttribute('data-open'); };
$('#mwin').onclick = () => logResult('win');
$('#mloss').onclick = () => logResult('loss');
$('#msend').onclick = () => {
  const s = (DATA.active_signals || []).find(x => x.signal_id === LOG_ID);
  const v = $('#mcustom').value.trim();
  if (!s || !v) return;
  tg('WIN: ' + s.ticker + ' ' + (s.strategy || '') + ' ' + v);
};

/* tick the window countdowns every 15s without refetching */
setInterval(() => {
  document.querySelectorAll('.countdown[data-close]').forEach(n => {
    const mins = Math.max(0, Math.floor(
      (new Date(n.getAttribute('data-close')) - Date.now()) / 60000));
    n.textContent = mins === 0 ? 'CLOSED' : mins + ' min left';
    n.className = 'countdown ' + (mins === 0 ? 'dead' : mins < 5 ? 'urgent' : '');
  });
}, 15000);

load();
setInterval(load, POLL_MS);
</script>
